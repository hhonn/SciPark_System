AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions deploy SciPark without any stored AWS keys. GitHub proves
  which repository and branch is running (OIDC) and gets short-lived credentials
  for a role that can only publish releases and roll the app fleet.

Parameters:
  GitHubRepo:
    Type: String
    Default: hhonn/SciPark_System
    Description: owner/repository
  Branch:
    Type: String
    Default: main
  AppStackName:
    Type: String
    Default: scipark-prod
    Description: Name of the stack created from scipark.yaml.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this account already has the GitHub OIDC provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppStackName}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Only pushes to this branch of this repository - not forks, not PRs.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${Branch}"
      Policies:
        - PolicyName: deploy-scipark
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
              # CloudFormation names the site and artifacts buckets
              # "<stack-name>-<logical-id>-<random>", so this prefix covers
              # exactly that stack's buckets (the media bucket is not included).
              - Sid: PublishReleaseAndSite
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket, s3:DeleteObject]
                Resource:
                  - !Sub "arn:aws:s3:::${AppStackName}-*"
                  - !Sub "arn:aws:s3:::${AppStackName}-*/*"
              - Sid: SelectRelease
                Effect: Allow
                Action: [ssm:PutParameter, ssm:GetParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*/release"
              - Sid: RollingDeploy
                Effect: Allow
                Action:
                  - autoscaling:StartInstanceRefresh
                  - autoscaling:DescribeInstanceRefreshes
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:CancelInstanceRefresh
                Resource: "*"
              - Sid: RefreshCdn
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
